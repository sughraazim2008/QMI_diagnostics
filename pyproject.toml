[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrc-qmi"
version = "0.1.0"
description = "Does quantum mutual information predict the quantum-classical performance gap of spin-network reservoir computers?"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "pyarrow>=14", "scikit-learn>=1.4",
  "statsmodels>=0.14", "optuna>=3.5", "matplotlib>=3.8", "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
